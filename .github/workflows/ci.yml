name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key-at-least-32-characters
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:////tmp/seo_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Unit tests
        run: PYTHONPATH=. python -m pytest app/tests/ -q --tb=short
      - name: Import app
        run: PYTHONPATH=. python -c "from app.main import app; print('routes', len(app.routes))"

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check app --select E,F,I,S,B --ignore S101,S104,S105,S311 || true
        # Non-blocking hygiene for MVP; tighten over time

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint || true
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  api-smoke:
    name: API smoke (health)
    runs-on: ubuntu-latest
    needs: [backend-test]
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key-at-least-32-characters
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:////tmp/seo_smoke.db
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: AdminSecure1!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          pip install -r requirements.txt
      - name: Start API
        run: |
          PYTHONPATH=. python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/live && break
            sleep 1
          done
      - name: Health checks
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/live
          curl -sf http://127.0.0.1:8000/ready
          curl -sf http://127.0.0.1:8000/robots.txt
      - name: Penetration script
        run: |
          chmod +x ../scripts/penetration-test.sh
          API_URL=http://127.0.0.1:8000 bash ../scripts/penetration-test.sh
